name: Build GUI executables

on:
  release:
    types: [published]  # attaches the archives to the release
  workflow_dispatch:    # manual test build (archives as workflow artifacts)

jobs:
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: flamingo-win64.zip
          - os: macos-latest  # Apple Silicon (arm64)
            asset: flamingo-macos-arm64.zip
          - os: ubuntu-24.04  # pinned: the executable needs a glibc at least as new as the build host
            asset: flamingo-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # upload release assets

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Tk (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y tk-dev

    - name: Install package and PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install . pyinstaller

    - name: Build executable
      run: pyinstaller flamingo.spec --noconfirm

    # Stable asset names, so README links to releases/latest/download/<asset> always work
    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist/flamingo.exe -DestinationPath dist/${{ matrix.asset }}

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent dist/flamingo.app dist/${{ matrix.asset }}  # keeps the app bundle intact

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: tar -czf dist/${{ matrix.asset }} -C dist flamingo  # tar keeps the executable bit

    - name: Attach to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/${{ matrix.asset }}

    - name: Upload as artifact (manual run)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        path: dist/${{ matrix.asset }}
        archive: false  # already an archive, no zip in a zip
