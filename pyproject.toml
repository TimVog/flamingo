[build-system]
requires = ["setuptools>=77"]  # SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "flamingo-thz"
dynamic = ["version"]  # single source: flamingo.__version__
description = "Data Correction Tool for THz Time Domain Spectroscopy"
authors = [
    { name = "Tim Vogel", email = "32876663+TimVog@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "scipy>=1.15",  # rng= keyword of differential_evolution
    "matplotlib",
    "h5py",
    "tqdm",
    "colorama",
    "customtkinter>=5.1.2",
]

[tool.setuptools.dynamic]
version = {attr = "flamingo.__version__"}

[project.urls]
Homepage = "https://github.com/TimVog/flamingo"
Repository = "https://github.com/TimVog/flamingo"

[project.scripts]
flamingo = "flamingo.main:main"
flamingo-gui = "flamingo.gui:main"
